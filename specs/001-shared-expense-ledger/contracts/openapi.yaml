openapi: 3.0.3
info:
  title: FairShareApp Shared Expense Ledger API
  version: 0.1.0
  description: Contract for groups, invites, expenses, settlements, balances, and ledger history.
servers:
  - url: https://api.fairshareapp.local
security:
  - bearerAuth: []
paths:
  /groups:
    post:
      summary: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
  /groups/{groupId}/invites:
    post:
      summary: Create invite
      operationId: createInvite
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created
    get:
      summary: List invites
      operationId: listInvites
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteResponse"
  /groups/{groupId}/invites/{inviteId}/revoke:
    post:
      summary: Revoke invite
      operationId: revokeInvite
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "200":
          description: Invite revoked
  /expenses:
    post:
      summary: Create expense
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
  /expenses/{expenseId}:
    patch:
      summary: Edit expense (before linked settlements)
      operationId: updateExpense
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "200":
          description: Expense updated
    delete:
      summary: Cancel expense (before linked settlements)
      operationId: deleteExpense
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "204":
          description: Expense cancelled
  /settlements:
    post:
      summary: Register settlement
      operationId: createSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementRequest"
      responses:
        "201":
          description: Settlement registered
  /groups/{groupId}/balance:
    get:
      summary: Get group balances
      operationId: getBalances
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Balance snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
  /groups/{groupId}/ledger:
    get:
      summary: Get ledger entries
      operationId: getLedger
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntryResponse"
  /users/{userId}/notification-preferences:
    put:
      summary: Update notification channels
      operationId: updateNotificationPreferences
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceRequest"
      responses:
        "200":
          description: Preferences updated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateGroupRequest:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        currency:
          type: string
          minLength: 3
          maxLength: 3
    GroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        ownerId:
          type: string
          format: uuid
    CreateInviteRequest:
      type: object
      required: [channel, recipient, expiresAt]
      properties:
        channel:
          type: string
          enum: [Link, Email]
        recipient:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Pending, Accepted, Revoked, Expired]
        expiresAt:
          type: string
          format: date-time
    CreateExpenseRequest:
      type: object
      required: [groupId, paidByUserId, amount, description, requestId]
      properties:
        groupId:
          type: string
          format: uuid
        paidByUserId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0.01
        description:
          type: string
          minLength: 1
          maxLength: 200
        excludedUserIds:
          type: array
          items:
            type: string
            format: uuid
        requestId:
          type: string
    UpdateExpenseRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
        description:
          type: string
          minLength: 1
          maxLength: 200
    ExpenseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [Posted, Corrected, Cancelled]
    CreateSettlementRequest:
      type: object
      required: [groupId, fromUserId, toUserId, amount, requestId]
      properties:
        groupId:
          type: string
          format: uuid
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0.01
        requestId:
          type: string
    BalanceResponse:
      type: object
      properties:
        groupId:
          type: string
          format: uuid
        balances:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
              balance:
                type: number
                format: double
    LedgerEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        entryType:
          type: string
        occurredAt:
          type: string
          format: date-time
    NotificationPreferenceRequest:
      type: object
      required: [groupId, channels]
      properties:
        groupId:
          type: string
          format: uuid
        channels:
          type: array
          items:
            type: string
            enum: [InApp, Email, Telegram]
